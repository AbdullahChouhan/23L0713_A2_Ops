services:
  - type: web
    name: 23L0713_A2_Ops
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PROJECT_NAME
        value: 23L0713_A2_Ops
      - key: MODEL_PATH
        value: models/champion_model.keras
      - key: MODEL_VERSION
        value: VisionGuard-MobileNetV2-v2@champion
